<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d"><title id="t">W-AUTH-12 — Facebook: nhập email (`/auth/facebook-email`)</title><desc id="d">Facebook: nhập email (`/auth/facebook-email`)</desc><rect x="0.0" y="0.0" width="1000.0" height="640.0" rx="0" fill="#F7F7F8"/><text x="500.0" y="126.2" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#4338CA" text-anchor="middle" xml:space="preserve">Lingozi</text><rect x="280.0" y="144.7" width="440.0" height="346.7" rx="16" fill="#FFFFFF" stroke="#DCDCE3" stroke-width="1"/><text x="312.0" y="200.7" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#1B1B22" text-anchor="start" xml:space="preserve">Nhập email để tiếp tục</text><text x="312.0" y="241.5" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A4A57" text-anchor="start" xml:space="preserve">Facebook không chia sẻ email của bạn. Chúng tôi</text><text x="312.0" y="264.6" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A4A57" text-anchor="start" xml:space="preserve">sẽ gửi mã xác nhận tới email này.</text><text x="312.0" y="302.2" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1B1B22" text-anchor="start" xml:space="preserve">Email *</text><rect x="312.0" y="315.1" width="376.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><text x="328.0" y="340.6" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">an@example.com</text><rect x="312.0" y="375.1" width="376.0" height="48.0" rx="8" fill="#4F46E5"/><text x="500.0" y="402.2" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Gửi mã</text><text x="312.0" y="450.2" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#4338CA" text-anchor="start" xml:space="preserve">Hủy và quay lại đăng nhập</text><line x1="312.0" y1="454.4" x2="477.5" y2="454.4" stroke="#4338CA" stroke-width="1"/><text x="500.0" y="525.0" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="middle" xml:space="preserve">Chính sách quyền riêng tư · Xóa dữ liệu</text></svg>

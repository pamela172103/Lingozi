<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 686" width="760" height="686" role="img" aria-labelledby="t d"><title id="t">W-LIB-33 — Gợi ý nghĩa: từ mục của bạn và từ điển</title><desc id="d">Gợi ý nghĩa: từ mục của bạn và từ điển</desc><rect x="0.0" y="0.0" width="760.0" height="686.5" rx="0" fill="#F7F7F8"/><text x="28.0" y="33.6" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#62626F" text-anchor="start" xml:space="preserve">Dropdown khi ô nghĩa hoặc ví dụ có focus (dữ liệu minh họa)</text><rect x="28.0" y="52.0" width="704.0" height="602.5" rx="12" fill="#FFFFFF" stroke="#DCDCE3" stroke-width="1"/><text x="52.0" y="87.2" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1B1B22" text-anchor="start" xml:space="preserve">Từ *</text><rect x="52.0" y="100.0" width="656.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><text x="68.0" y="125.5" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#1B1B22" text-anchor="start" xml:space="preserve">abandon</text><text x="52.0" y="171.2" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1B1B22" text-anchor="start" xml:space="preserve">Nghĩa *</text><rect x="52.0" y="184.0" width="656.0" height="64.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><text x="68.0" y="207.0" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Nhập nghĩa của từ</text><rect x="52.0" y="248.0" width="656.0" height="177.1" rx="12" fill="#FFFFFF" stroke="#DCDCE3" stroke-width="1"/><text x="64.0" y="271.2" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1B1B22" text-anchor="start" xml:space="preserve">từ bỏ</text><text x="64.0" y="293.9" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Từ mục của bạn</text><text x="64.0" y="326.9" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1B1B22" text-anchor="start" xml:space="preserve">ngừng cố gắng</text><text x="64.0" y="349.6" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Từ mục của bạn</text><text x="64.0" y="382.6" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1B1B22" text-anchor="start" xml:space="preserve">từ bỏ; bỏ lại phía sau</text><text x="64.0" y="405.3" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Scandict</text><text x="52.0" y="452.3" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1B1B22" text-anchor="start" xml:space="preserve">Câu ví dụ</text><rect x="52.0" y="465.1" width="656.0" height="44.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><text x="68.0" y="490.6" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Chọn hoặc nhập ví dụ</text><rect x="52.0" y="509.1" width="656.0" height="121.4" rx="12" fill="#FFFFFF" stroke="#DCDCE3" stroke-width="1"/><text x="64.0" y="532.3" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1B1B22" text-anchor="start" xml:space="preserve">We abandoned the old car</text><text x="64.0" y="555.0" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Chúng tôi bỏ lại chiếc xe cũ</text><text x="64.0" y="588.0" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#1B1B22" text-anchor="start" xml:space="preserve">To abandon a hope</text><text x="64.0" y="610.7" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Từ bỏ hy vọng</text></svg>

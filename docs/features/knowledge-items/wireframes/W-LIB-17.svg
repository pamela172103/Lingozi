400" fill="#62626F" text-anchor="start" xml:space="preserve">Tôi đã sống ở đây năm năm.</text><text x="300.0" y="390.4" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#1B1B22" text-anchor="start" xml:space="preserve">2. She has just left.</text><text x="300.0" y="412.5" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Cô ấy vừa rời đi.</text><text x="300.0" y="449.3" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#62626F" text-anchor="start" xml:space="preserve">Ghi chú</text><text x="300.0" y="475.8" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#1B1B22" text-anchor="start" xml:space="preserve">Thường đi với just, already, yet, for, since.</text><line x1="300.0" y1="504.0" x2="964.0" y2="504.0" stroke="#DCDCE3" stroke-width="1"/><text x="300.0" y="532.9" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Tạo 08/11/2026 14:00 · Sửa 08/11/2026 14:05</text></svg>

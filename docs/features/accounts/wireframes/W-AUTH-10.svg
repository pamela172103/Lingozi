space="preserve">thử lại.</text><rect x="312.0" y="340.9" width="376.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><text x="500.0" y="368.1" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1B1B22" text-anchor="middle" xml:space="preserve">Tiếp tục với Google</text><rect x="312.0" y="404.9" width="376.0" height="48.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><text x="500.0" y="432.1" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#1B1B22" text-anchor="middle" xml:space="preserve">Tiếp tục với Facebook</text><text x="312.0" y="478.5" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">hoặc</text><rect x="312.0" y="502.3" width="376.0" height="48.0" rx="8" fill="#4F46E5"/><text x="500.0" y="529.5" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Tiếp tục với email</text><text x="500.0" y="615.9" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="middle" xml:space="preserve">Chính sách quyền riêng tư · Xóa dữ liệu</text></svg>

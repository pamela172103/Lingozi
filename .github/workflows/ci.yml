name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-tokens:
    name: Design tokens
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: WCAG contrast for every theme
        run: python3 tools/design-tokens/check_contrast.py docs/architecture/design-tokens.json
      - name: Generated tokens.css is up to date
        run: python3 tools/design-tokens/build_css.py --check

  feature-docs:
    name: Feature docs and wireframes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Story SRS match user stories, links and wireframes resolve
        run: python3 -I tools/feature-docs/check_feature_docs.py
      - name: Wireframe SVG files are up to date with tools/wireframes
        run: python3 tools/wireframes/build.py --check
      - name: Wireframe blocks in SRS are up to date
        run: python3 tools/wireframes/sync_docs.py --check

  web:
    name: Web (lint, typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    env:
      API_ORIGIN: http://localhost:5080
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lingozi/web lint
      - run: pnpm --filter @lingozi/web typecheck
      - run: pnpm --filter @lingozi/web format:check
      - run: pnpm --filter @lingozi/web test
      - run: pnpm --filter @lingozi/web build
      - run: pnpm --filter @lingozi/e2e typecheck

  api:
    name: API (build, migrations, integration tests on SQL Server)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/api/global.json
      - run: dotnet tool restore
      - run: dotnet build -warnaserror
      - name: No model changes without a migration
        run: >-
          dotnet ef migrations has-pending-model-changes --no-build
          --project src/Modules/Accounts/Lingozi.Accounts --startup-project src/Modules/Accounts/Lingozi.Accounts
          --context AccountsDbContext
      - name: No Library model changes without a migration
        run: >-
          dotnet ef migrations has-pending-model-changes --no-build
          --project src/Modules/Library/Lingozi.Library --startup-project src/Modules/Library/Lingozi.Library
          --context LibraryDbContext
      - name: Integration tests (Testcontainers SQL Server 2025)
        run: dotnet test --no-build

  e2e:
    name: E2E (web → API → SQL Server)
    needs: [web, api]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/api/global.json
      - name: Create throwaway local .env
        run: |
          PW="Ci-$(openssl rand -hex 12)-A1!"
          echo "::add-mask::$PW"
          {
            echo "MSSQL_SA_PASSWORD=$PW"
            echo "ConnectionStrings__Lingozi=\"Server=localhost,1433;Database=Lingozi;User Id=sa;Password=$PW;TrustServerCertificate=true;Encrypt=true\""
            echo "ASPNETCORE_ENVIRONMENT=Development"
            echo "Pronunciation__Provider=none"
            echo "API_ORIGIN=http://localhost:5080"
            echo "Auth__LoginCodeHmacKey=$(openssl rand -base64 32)"
            echo "Auth__RequestCodePerIpPer10Minutes=1000"
            echo "Auth__VerifyCodePerIpPer10Minutes=1000"
            echo "Email__SmtpHost=localhost"
            echo "Email__SmtpPort=1025"
            echo "Email__SmtpUseTls=false"
            echo "Email__PollIntervalSeconds=1"
          } > .env
      - run: docker compose up -d --wait sqlserver mailpit
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lingozi/web build
        env:
          API_ORIGIN: http://localhost:5080
      - name: Start API and web
        run: |
          set -a; . ./.env; set +a
          (cd apps/api && nohup dotnet run --project src/Lingozi.Api --launch-profile http > ../../api.log 2>&1 &)
          (cd apps/web && nohup pnpm start > ../../web.log 2>&1 &)
          for i in $(seq 1 90); do
            curl -sf http://localhost:5080/health/ready > /dev/null && curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "Services did not become ready"; tail -50 api.log web.log; exit 1
      - run: pnpm --filter @lingozi/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @lingozi/e2e test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            api.log
            web.log
          retention-days: 7

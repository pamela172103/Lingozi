<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d"><title id="t">W-AUTH-14 — Nhập mã sau Facebook: liên kết vào tài khoản đã có (ERR-AUTH-409-02)</title><desc id="d">Nhập mã sau Facebook: liên kết vào tài khoản đã có (ERR-AUTH-409-02)</desc><rect x="0.0" y="0.0" width="1000.0" height="760.0" rx="0" fill="#F7F7F8"/><text x="500.0" y="151.7" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#4338CA" text-anchor="middle" xml:space="preserve">Lingozi</text><rect x="280.0" y="170.1" width="440.0" height="415.8" rx="16" fill="#FFFFFF" stroke="#DCDCE3" stroke-width="1"/><rect x="312.0" y="202.1" width="376.0" height="68.0" rx="8" fill="#EDF1FC" stroke="#A5B8EF" stroke-width="1"/><circle cx="336.0" cy="236.1" r="10" fill="#1D4ED8"/><text x="336.0" y="238.5" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">i</text><text x="358.0" y="228.3" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#1B1B22" text-anchor="start" xml:space="preserve">Email này đã có tài khoản Lingozi. Nhập mã để</text><text x="358.0" y="248.3" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#1B1B22" text-anchor="start" xml:space="preserve">xác nhận và liên kết Facebook vào tài khoản đó.</text><text x="312.0" y="310.1" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" fill="#1B1B22" text-anchor="start" xml:space="preserve">Nhập mã</text><text x="312.0" y="350.9" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A4A57" text-anchor="start" xml:space="preserve">Chúng tôi đã gửi mã 6 số tới chi@example.com.</text><text x="312.0" y="374.1" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="400" fill="#4A4A57" text-anchor="start" xml:space="preserve">Mã có hiệu lực 10 phút (còn 09:58).</text><rect x="312.0" y="400.5" width="48.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><rect x="368.0" y="400.5" width="48.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><rect x="424.0" y="400.5" width="48.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><rect x="480.0" y="400.5" width="48.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><rect x="536.0" y="400.5" width="48.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><rect x="592.0" y="400.5" width="48.0" height="56.0" rx="8" fill="#FFFFFF" stroke="#7E7E8C" stroke-width="1"/><rect x="312.0" y="472.5" width="376.0" height="48.0" rx="8" fill="#4F46E5"/><text x="500.0" y="499.7" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">Xác nhận</text><text x="312.0" y="546.1" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Không nhận được mã?</text><text x="442.8" y="546.1" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="start" xml:space="preserve">Đổi email</text><text x="500.0" y="619.5" font-family="'Be Vietnam Pro','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#62626F" text-anchor="middle" xml:space="preserve">Chính sách quyền riêng tư · Xóa dữ liệu</text></svg>
